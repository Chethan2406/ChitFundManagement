# Example configuration file - Copy to application.properties and configure for your environment

# Server Configuration
server.port=8075
server.servlet.context-path=/CFM/v1

# Application Configuration
spring.application.name=chitfund
spring.profiles.active=dev

# JWT Security Configuration
# SECURITY WARNING: Change these values for production!
# Use a complex secret key (minimum 256 bits for HS256)
security.jwt.token.secret-key=CHANGE_THIS_SECRET_TO_A_SECURE_RANDOM_256_BIT_KEY_FOR_PRODUCTION
security.jwt.token.expire-length=86400000

# Database Configuration
# WARNING: Do not commit actual database credentials to version control
spring.datasource.url=jdbc:postgresql://localhost:5432/chitfund
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

# Swagger Configuration
app.api.swagger.enable=true